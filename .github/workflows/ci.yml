name: Screenslavers CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: python -m scripts.smoke_test
  member1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r member1/requirements.txt
      - run: cd member1 && python -m pytest tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run real API contract tests
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/screenslavers_api.log 2>&1 &
          python - <<'PYWAIT'
          import time, urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2) as response:
                      if response.status == 200: break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('API did not start in 60 seconds')
          PYWAIT
          cd frontend
          npm test
